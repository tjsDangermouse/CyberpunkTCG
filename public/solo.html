<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk TCG — Solo Mode</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="solo.css">
</head>
<body class="solo-page">
  <main class="solo-shell">
    <div class="table-noise" aria-hidden="true"></div>
    <div class="table-vignette" aria-hidden="true"></div>

    <aside class="corner-stack">
      <aside class="corner-hud corner-hud-left">
        <div class="hud-cluster">
          <p class="zone-label">Run Status</p>
          <div id="status-grid" class="status-grid"></div>
        </div>
        <div class="hud-cluster">
          <p class="zone-label">Objectives</p>
          <div class="metric-line">
            <span>Secured</span>
            <strong id="objective-progress">0 / 3</strong>
          </div>
          <p id="run-summary" class="run-summary">Use your saved deck or the fallback runner stack.</p>
        </div>
      </aside>

      <aside class="corner-hud corner-hud-secondary">
        <div class="hud-cluster">
          <div class="metric-line">
            <span>Alert</span>
            <strong id="alert-display">0 / 10</strong>
          </div>
          <div class="metric-line">
            <span>Phase</span>
            <strong id="phase-display">Setup</strong>
          </div>
        </div>
        <div class="hud-cluster phase-hud">
          <span id="phase-chip-setup" class="phase-chip active">Setup</span>
          <span id="phase-chip-player-main" class="phase-chip">Main</span>
          <span id="phase-chip-player-attack" class="phase-chip">Attack</span>
          <span id="phase-chip-boss-turn" class="phase-chip">Boss</span>
          <span id="phase-chip-game-over" class="phase-chip">Over</span>
        </div>
        <div class="hud-cluster hud-actions">
          <button id="log-toggle-btn" class="btn hud-btn" type="button">Log</button>
          <button id="reset-btn" class="btn btn-red hud-btn" type="button">Reset</button>
        </div>
      </aside>

      <aside id="card-preview-overlay" class="card-preview-overlay is-hidden">
        <div class="preview-head">
          <p class="zone-label">Preview</p>
          <h2 id="preview-title">Hover a card</h2>
        </div>
        <div id="card-preview" class="card-preview"></div>
      </aside>

      <aside id="turn-log-drawer" class="turn-log-drawer">
        <div class="drawer-head">
          <div>
            <p class="zone-label">Run Log</p>
            <h2>Combat Feed</h2>
          </div>
          <button id="log-close-btn" class="btn hud-btn" type="button">Close</button>
        </div>
        <div id="turn-log" class="turn-log"></div>
      </aside>
    </aside>

    <section id="solo-board" class="solo-board" aria-label="Solo game board">
      <div id="board-interaction-overlay" class="board-interaction-overlay" aria-hidden="true">
        <svg id="interaction-lines" class="interaction-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <marker id="attack-arrow-head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
              <path d="M0,0 L7,3.5 L0,7 z"></path>
            </marker>
          </defs>
          <line id="attack-line" x1="0" y1="0" x2="0" y2="0"></line>
        </svg>
      </div>
      <section class="board-zone boss-zone">
        <div class="boss-zone-layout">
          <div id="boss-core" class="boss-core"></div>
          <div class="card-rail zone-rail">
            <div id="boss-board" class="zone-card-row"></div>
          </div>
        </div>
      </section>

      <section class="board-zone objective-belt">
        <div id="objective-zone" class="objective-zone"></div>
      </section>

      <section id="player-zone" class="board-zone player-zone">
        <div class="card-rail zone-rail player-rail">
          <div id="player-board" class="zone-card-row"></div>
        </div>
      </section>
    </section>

    <section class="hand-stage">
      <section class="hand-tray">
        <div class="action-bar">
          <button id="start-btn" class="btn btn-gold" type="button">Start Run</button>
          <button id="play-btn" class="btn btn-gold" type="button">Play</button>
          <button id="end-phase-btn" class="btn" type="button">End Main</button>
          <button id="attack-btn" class="btn" type="button">Attack</button>
          <button id="confirm-target-btn" class="btn btn-gold" type="button">Confirm Target</button>
          <button id="end-turn-btn" class="btn" type="button">End Turn</button>
        </div>
        <div id="player-hand" class="hand-row"></div>
      </section>
    </section>
  </main>
  <div id="preview-zoom" class="preview-zoom" aria-hidden="true">
    <img id="preview-zoom-image" alt="">
  </div>
  <div id="game-over-overlay" class="game-over-overlay is-hidden" aria-hidden="true">
    <div class="game-over-card">
      <p class="zone-label">Encounter Result</p>
      <h2 id="game-over-title">Run Complete</h2>
      <p id="game-over-text" class="run-summary"></p>
      <button id="restart-run-btn" class="btn btn-gold" type="button">Restart Run</button>
    </div>
  </div>

  <script src="soloGameTypes.js"></script>
  <script src="soloBosses.js"></script>
  <script src="soloCardUtils.js"></script>
  <script src="soloGameReducer.js"></script>
  <script src="solo.js"></script>
</body>
</html>
