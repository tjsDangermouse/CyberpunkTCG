<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk TCG — Print Cards</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Screen styles ───────────────────────────────────── */
    .print-toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .print-toolbar label {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 0.4rem;
    }

    .print-toolbar .select { width: auto; min-width: 140px; }

    .card-selector {
      padding: 1rem 2rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .card-selector h3 {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.4rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .select-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: border-color 0.1s;
      user-select: none;
    }

    .select-item:hover { border-color: var(--accent); }
    .select-item.selected { border-color: var(--accent); background: rgba(0,229,255,0.08); }
    .select-item input[type=checkbox] { accent-color: var(--accent); }

    .select-item-img {
      width: 28px;
      height: 39px;
      object-fit: cover;
      border-radius: 1px;
      background: var(--surface);
    }

    .select-item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-display);
    }

    .select-item-type {
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .select-controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .selection-count {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .selection-count span { color: var(--accent); font-weight: 700; }

    /* ── Preview area ────────────────────────────────────── */
    .preview-container {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .preview-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Wrapper sized to the *scaled* page dimensions so it occupies
       exactly the visual footprint — no layout drift between pages.
       Width/height are set in mm by JS. overflow:hidden clips the
       unscaled inner page that extends beyond the wrapper. */
    .page-preview-wrapper {
      overflow: hidden;
      display: block;
      margin: 0 auto;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
    }

    /* ── Print layout ────────────────────────────────────── */
    /*
     * Standard TCG card: 63mm × 88mm (poker-size)
     * Cut mark bleed: 4mm on each side
     * Each card slot = 63mm × 88mm + 8mm bleed total = 71mm × 96mm
     *
     * A4  portrait : 210 × 297mm → 3×3 = 9 cards
     * A4  landscape: 297 × 210mm → 4×2 = 8 cards
     * US Letter portrait : 215.9 × 279.4mm → 3×3 = 9 cards
     */

    .print-page {
      --card-w: 63mm;
      --card-h: 88mm;
      --bleed: 4mm;
      --slot-w: calc(var(--card-w) + var(--bleed) * 2);
      --slot-h: calc(var(--card-h) + var(--bleed) * 2);
      --mark-len: 3mm;
      --mark-gap: 1mm;
      --mark-color: #555;
      --mark-width: 0.25mm;

      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      /* Scale is applied via JS; transform-origin keeps top-left corner
         anchored to the wrapper's top-left so cropping works correctly. */
      transform-origin: top left;
    }

    .print-page.size-a4-portrait  { width: 210mm; height: 297mm; }
    .print-page.size-a4-landscape { width: 297mm; height: 210mm; }
    .print-page.size-letter-portrait  { width: 215.9mm; height: 279.4mm; }
    .print-page.size-letter-landscape { width: 279.4mm; height: 215.9mm; }

    .card-rows {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-row {
      display: flex;
      flex-direction: row;
    }

    /* Each slot holds the card + bleed space for cut marks */
    .card-slot {
      width: var(--slot-w);
      height: var(--slot-h);
      position: relative;
      flex-shrink: 0;
    }

    /* The actual card image */
    .card-slot .print-card {
      position: absolute;
      left: var(--bleed);
      top: var(--bleed);
      width: var(--card-w);
      height: var(--card-h);
      overflow: hidden;
      border-radius: 3mm;
    }

    .card-slot .print-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback card face */
    .card-slot .print-card .card-face {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00e5ff;
      font-family: 'Arial Narrow', sans-serif;
      text-align: center;
      padding: 4mm;
      gap: 2mm;
    }

    .card-slot .print-card .card-face .cf-name {
      font-size: 8pt;
      font-weight: bold;
      color: white;
      line-height: 1.2;
    }

    .card-slot .print-card .card-face .cf-type {
      font-size: 6pt;
      color: #00e5ff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card-slot .print-card .card-face .cf-stats {
      font-size: 7pt;
      color: #aaa;
      margin-top: 1mm;
    }

    /* ── Cut marks ───────────────────────────────────────── */
    /* L-shaped marks at all 4 corners of the card (outside the card boundary) */
    .card-slot::before,
    .card-slot::after,
    .card-slot .mark-br,
    .card-slot .mark-bl {
      content: '';
      position: absolute;
      pointer-events: none;
    }

    /* Top-left corner */
    .card-slot::before {
      /* Horizontal line going left from card edge */
      top: calc(var(--bleed));
      left: calc(var(--bleed) - var(--mark-gap) - var(--mark-len));
      width: var(--mark-len);
      height: var(--mark-width);
      background: var(--mark-color);
      box-shadow: 0 calc(var(--card-h)) 0 0 var(--mark-color);
    }

    .card-slot::after {
      /* Vertical line going up from card edge */
      top: calc(var(--bleed) - var(--mark-gap) - var(--mark-len));
      left: calc(var(--bleed));
      width: var(--mark-width);
      height: var(--mark-len);
      background: var(--mark-color);
      box-shadow: calc(var(--card-w)) 0 0 0 var(--mark-color);
    }

    /* Bottom-right corner */
    .card-slot .mark-br {
      /* Horizontal line going right */
      top: calc(var(--bleed) + var(--card-h));
      right: calc(var(--bleed) - var(--mark-gap) - var(--mark-len));
      width: var(--mark-len);
      height: var(--mark-width);
      background: var(--mark-color);
      margin-top: var(--mark-gap);
    }

    .card-slot .mark-bl {
      /* Vertical line going down from bottom */
      bottom: calc(var(--bleed) - var(--mark-gap) - var(--mark-len));
      left: calc(var(--bleed));
      width: var(--mark-width);
      height: var(--mark-len);
      background: var(--mark-color);
      box-shadow: calc(var(--card-w)) 0 0 0 var(--mark-color);
    }

    /* Empty slot (no card assigned) */
    .card-slot.empty .print-card {
      border: 0.3mm dashed #ddd;
      border-radius: 3mm;
      background: #f9f9f9;
    }

    /* ── @media print ────────────────────────────────────── */
    /* The print area is a completely separate DOM tree built by JS
       when the print button is clicked. It contains only bare .print-page
       divs with no wrappers, no transforms, and no flex ancestors —
       so every page is positioned identically by the print engine. */
    #print-area { display: none; }

    @media print {
      /* Hide the entire screen UI */
      body > *:not(#print-area) { display: none !important; }

      #print-area {
        display: block !important;
        background: white;
      }

      #print-area .print-page {
        break-after: page;
        page-break-after: always;
      }

      #print-area .print-page:last-child {
        break-after: avoid;
        page-break-after: avoid;
      }

      @page { size: A4 portrait; margin: 0; }
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-dim);
      font-family: var(--font-display);
    }

    .loading-state { color: var(--accent); font-size: 1.1rem; letter-spacing: 0.2em; }
  </style>
</head>
<body>

<header class="site-header no-print">
  <div class="site-logo">Cyber<span>punk</span> TCG</div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Cards</a></li>
      <li><a href="print.html" class="active">Print</a></li>
    </ul>
  </nav>
</header>

<!-- Toolbar -->
<div class="print-toolbar no-print">
  <div>
    <label>Paper Size</label>
    <select class="select" id="paper-size">
      <option value="a4-portrait">A4 Portrait (3×3 cards)</option>
      <option value="a4-landscape">A4 Landscape (4×2 cards)</option>
      <option value="letter-portrait">Letter Portrait (3×3 cards)</option>
      <option value="letter-landscape">Letter Landscape (4×2 cards)</option>
    </select>
  </div>
  <div>
    <label>Scale</label>
    <select class="select" id="preview-scale">
      <option value="0.4">40%</option>
      <option value="0.5" selected>50%</option>
      <option value="0.6">60%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
  </div>
  <div>
    <label>Show</label>
    <select class="select" id="show-marks">
      <option value="1" selected>Cut marks</option>
      <option value="0">No cut marks</option>
    </select>
  </div>
  <button class="btn btn-gold" id="print-btn">⬛ Print / Save PDF</button>
  <div id="page-count" style="font-size:0.8rem;color:var(--text-dim);margin-left:auto"></div>
</div>

<!-- Card selector -->
<div class="card-selector no-print">
  <div class="select-controls">
    <h3>Select cards to print</h3>
    <button class="btn" id="select-all-btn">Select All</button>
    <button class="btn btn-red" id="select-none-btn">Clear</button>
    <input class="input" id="card-search" placeholder="Filter cards…" style="width:220px">
    <span class="selection-count">Selected: <span id="sel-count">0</span></span>
  </div>
  <div class="select-grid" id="select-grid">
    <div class="loading-state">LOADING…</div>
  </div>
</div>

<!-- Preview -->
<div class="preview-container" id="preview-container">
  <div class="preview-label no-print">Print Preview</div>
  <div id="pages-root"></div>
</div>

<!-- Populated by JS on print; hidden on screen, only shown @media print -->
<div id="print-area"></div>

<script src="print.js"></script>
</body>
</html>
